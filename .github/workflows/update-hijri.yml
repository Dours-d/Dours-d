name: Update Hijri Date
on:
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Rebuild README
        shell: python
        run: |
          import urllib.request
          import urllib.error
          import json
          import sys

          TIMEOUT_SECONDS = 15

          # 1. Get the Date
          try:
              req = urllib.request.Request("http://api.aladhan.com/v1/gToH")
              with urllib.request.urlopen(req, timeout=TIMEOUT_SECONDS) as response:
                  if response.status != 200:
                      print(f"API returned unexpected status: {response.status}")
                      sys.exit(1)
                  raw = response.read().decode()
          except urllib.error.HTTPError as e:
              print(f"API HTTP error {e.code}: {e.reason}")
              sys.exit(1)
          except urllib.error.URLError as e:
              print(f"API connection error: {e.reason}")
              sys.exit(1)
          except TimeoutError:
              print(f"API request timed out after {TIMEOUT_SECONDS}s")
              sys.exit(1)

          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"API returned invalid JSON: {e}")
              sys.exit(1)

          hijri = data.get('data', {}).get('hijri')
          if not hijri:
              print(f"Unexpected API response structure: missing 'data.hijri'. Response keys: {list(data.keys())}")
              sys.exit(1)

          required_fields = {'day': hijri.get('day'), 'year': hijri.get('year')}
          month = hijri.get('month', {})
          required_fields['month.en'] = month.get('en')
          required_fields['month.ar'] = month.get('ar')

          missing = [k for k, v in required_fields.items() if not v]
          if missing:
              print(f"API response missing required fields: {', '.join(missing)}")
              sys.exit(1)

          date_str = (
              "### ﷽\n"
              f"### 🌙 {required_fields['day']} {required_fields['month.en']} {required_fields['year']} | {required_fields['month.ar']} ﷺ"
          )

          # 2. Markers (Must match exactly what is in your README.md)
          start_tag = "[//]: # (HIJRI_START)"
          end_tag = "[//]: # (HIJRI_END)"

          # 3. Read README
          try:
              with open("README.md", "r", encoding="utf-8") as f:
                  lines = f.readlines()
          except FileNotFoundError:
              print("README.md not found in the repository root.")
              sys.exit(1)
          except OSError as e:
              print(f"Failed to read README.md: {e}")
              sys.exit(1)

          # 4. Filter and Replace
          new_lines = []
          skip = False
          start_found = False
          end_found = False

          for line in lines:
              if start_tag in line:
                  new_lines.append(line)
                  new_lines.append(date_str + "\n")
                  skip = True
                  start_found = True
              elif end_tag in line:
                  new_lines.append(line)
                  skip = False
                  end_found = True
              elif not skip:
                  new_lines.append(line)

          if not start_found:
              print(f"Start marker not found: {start_tag}")
              sys.exit(1)
          if not end_found:
              print(f"End marker not found: {end_tag} — content after start marker would be lost.")
              sys.exit(1)

          # 5. Write back
          try:
              with open("README.md", "w", encoding="utf-8") as f:
                  f.writelines(new_lines)
          except OSError as e:
              print(f"Failed to write README.md: {e}")
              sys.exit(1)
      - name: Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Clean Hijri Update"
          git push
